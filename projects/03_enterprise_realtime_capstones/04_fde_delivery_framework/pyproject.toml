[project]
name = "fde-delivery-framework"
version = "0.1.0"
description = "Delivery Framework: a gated FDE engagement pipeline from scoping doc to deployed agent."
requires-python = ">=3.12,<3.13"
# src/delivery_framework uses only the standard library; the notebook adds python-dotenv for its setup cell.
dependencies = [
    # shared course helpers (get_llm / get_openai_llm), pinned release tag
    "aied-helpers",
    # .env loading in the notebook setup cell
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[tool.uv.sources]
aied-helpers = { git = "https://github.com/Sourav692/ai-engineering-demystified-shared.git", rev = "v0.1.0" }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
]
