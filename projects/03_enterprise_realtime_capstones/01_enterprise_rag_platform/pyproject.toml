[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Meridian Assist: a multi-tenant enterprise RAG platform with attribute-based access control."
requires-python = ">=3.12,<3.13"
dependencies = [
    # src/enterprise_rag/graph/build.py: the LangGraph answer graph
    "langgraph>=1.0",
    # src/enterprise_rag/ingest/store.py: per-tenant vector collections
    "chromadb>=1.5.9",
    # src/enterprise_rag/llm/client.py: embeddings, generation, judge
    "openai>=1.0",
    # src/enterprise_rag/config.py: loads the nearest .env
    "python-dotenv>=1.0",
    # src/enterprise_rag/retrieval/lexical.py: BM25 keyword search
    "rank-bm25>=0.2",
    # databricks/*.py: REST validators
    "requests>=2.31",
    # notebooks/04-databricks-enterprise-rag.ipynb (preinstalled on a Databricks runtime)
    "databricks-sdk>=0.146.0",
    # shared course helpers (get_llm / get_openai_llm), pinned release tag
    "aied-helpers",
]

[tool.uv]
package = false

[tool.uv.sources]
aied-helpers = { git = "https://github.com/Sourav692/ai-engineering-demystified-shared.git", rev = "v0.1.0" }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
]
