[project]
name = "realtime-source-code-analyzer"
version = "0.1.0"
description = "Chat with a GitHub repository: clone, language-aware split, OpenAI embeddings in Chroma, conversational retrieval behind a Flask UI."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Core: LangChain 1.x (ConversationSummaryMemory / ConversationalRetrievalChain live in langchain-classic)
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-classic>=1.0",
    # GenericLoader + LanguageParser, Chroma vector store wrapper
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.0",
    # OpenAIEmbeddings + ChatOpenAI
    "langchain-openai>=1.0",
    "openai>=1.0",
    "tiktoken>=0.14.0",
    "chromadb>=0.4.4",
    # Repo.clone_from (import name: git)
    "gitpython>=3.2.0",
    "python-dotenv>=1.2.4",
    # app.py web UI
    "flask>=3.1.3",
    # shared course helpers (get_llm / get_openai_llm), pinned release tag
    "aied-helpers",
]

[tool.uv]
package = false

[tool.uv.sources]
aied-helpers = { git = "https://github.com/Sourav692/ai-engineering-demystified-shared.git", rev = "v0.1.0" }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]
