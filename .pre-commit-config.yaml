# Activate once per clone:  uv sync && uv run pre-commit install
# Notebook outputs are committed (from one clean top-to-bottom run), so nbstripout only strips
# volatile metadata here; it never clears outputs or execution counts on disk.
repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        name: strip volatile notebook metadata (outputs are kept)
        args: [--keep-output, --keep-count]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff
        args: [--fix]
  - repo: local
    hooks:
      - id: check-notebooks
        name: notebooks are valid, titled, cleanly run (if run), key-free, and their paths resolve
        entry: uv run python scripts/check_notebooks.py
        language: system
        pass_filenames: false
      - id: check-links
        name: links resolve and the repository is self-contained
        entry: uv run python scripts/check_links.py
        language: system
        pass_filenames: false
